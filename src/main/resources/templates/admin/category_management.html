<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead}">
    <title>Categories — Admin | ChickenExpress</title>
</head>
<body th:replace="~{layout/admin-layout :: adminBody('Categories')}">

<th:block th:fragment="content">

    <!-- Add button -->
    <div class="d-flex justify-content-end mb-4">
        <button class="btn ce-btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
            <i class="bi bi-plus-lg"></i> Add Category
        </button>
    </div>

    <!-- Category table -->
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th class="text-center">Sort</th>
                        <th class="text-center">Status</th>
                        <th class="text-center">Products</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td class="fw-medium" th:text="${cat.name}">Category</td>
                        <td class="text-muted small" th:text="${cat.description ?: '—'}">—</td>
                        <td class="text-center text-muted small" th:text="${cat.sortOrder}">0</td>
                        <td class="text-center">
                            <span th:if="${cat.active}" class="badge bg-success">Active</span>
                            <span th:unless="${cat.active}" class="badge bg-secondary">Inactive</span>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-light text-dark border"
                                  th:text="${cat.products.size()}">0</span>
                        </td>
                        <td class="text-end">
                            <!-- Edit button — populates modal via JS -->
                            <button class="btn btn-sm btn-outline-primary me-1"
                                    th:data-id="${cat.id}"
                                    th:data-name="${cat.name}"
                                    th:data-description="${cat.description}"
                                    th:data-sort="${cat.sortOrder}"
                                    th:data-active="${cat.active}"
                                    onclick="openEditModal(this)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <!-- Delete button — populates confirm modal -->
                            <button class="btn btn-sm btn-outline-danger"
                                    th:data-id="${cat.id}"
                                    th:data-name="${cat.name}"
                                    th:data-count="${cat.products.size()}"
                                    onclick="openDeleteModal(this)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${categories.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-4">
                            No categories yet. Add the first one.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!--  ADD CATEGORY MODAL                                                 -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/categories/new}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">
                            <i class="bi bi-plus-circle"></i> Add Category
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control"
                                   placeholder="e.g. Chicken Meals" required maxlength="100"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Description</label>
                            <textarea name="description" class="form-control" rows="2"
                                      placeholder="Short description (optional)" maxlength="255"></textarea>
                        </div>
                        <div class="mb-1">
                            <label class="form-label fw-medium">Display Order</label>
                            <input type="number" name="sortOrder" class="form-control"
                                   value="0" min="0" max="999"/>
                            <div class="form-text">Lower number = shown first in the menu.</div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn ce-btn-primary">
                            <i class="bi bi-save"></i> Save Category
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!--  EDIT CATEGORY MODAL                                                -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <div class="modal fade" id="editCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editCategoryForm" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">
                            <i class="bi bi-pencil-square"></i> Edit Category
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Name <span class="text-danger">*</span></label>
                            <input type="text" id="editName" name="name" class="form-control"
                                   required maxlength="100"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Description</label>
                            <textarea id="editDescription" name="description"
                                      class="form-control" rows="2" maxlength="255"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Display Order</label>
                            <input type="number" id="editSortOrder" name="sortOrder"
                                   class="form-control" min="0" max="999"/>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   id="editActive" name="active" value="true"/>
                            <label class="form-check-label" for="editActive">Active</label>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn ce-btn-primary">
                            <i class="bi bi-save"></i> Update Category
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!--  DELETE CONFIRM MODAL                                               -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <div class="modal fade" id="deleteCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <form id="deleteCategoryForm" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold text-danger">
                            <i class="bi bi-trash3"></i> Delete Category
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body pt-2">
                        <p class="mb-0">Delete <strong id="deleteTargetName"></strong>?
                            This cannot be undone.</p>
                        <p id="deleteWarning" class="text-danger small mt-2 mb-0 d-none">
                            <i class="bi bi-exclamation-triangle"></i>
                            This category has products. Reassign them first.
                        </p>
                    </div>

                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                data-bs-dismiss="modal">Cancel</button>
                        <button id="deleteConfirmBtn" type="submit"
                                class="btn btn-danger btn-sm">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!--  Modal helper scripts                                               -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <script th:inline="javascript">
        function openEditModal(btn) {
            const id   = btn.dataset.id;
            const name = btn.dataset.name;
            const desc = btn.dataset.description || '';
            const sort = btn.dataset.sort;
            const active = btn.dataset.active === 'true';

            document.getElementById('editCategoryForm').action = '/admin/categories/' + id + '/edit';
            document.getElementById('editName').value = name;
            document.getElementById('editDescription').value = desc;
            document.getElementById('editSortOrder').value = sort;
            document.getElementById('editActive').checked = active;

            new bootstrap.Modal(document.getElementById('editCategoryModal')).show();
        }

        function openDeleteModal(btn) {
            const id    = btn.dataset.id;
            const name  = btn.dataset.name;
            const count = parseInt(btn.dataset.count, 10);

            document.getElementById('deleteCategoryForm').action = '/admin/categories/' + id + '/delete';
            document.getElementById('deleteTargetName').textContent = '"' + name + '"';

            const warning = document.getElementById('deleteWarning');
            const confirmBtn = document.getElementById('deleteConfirmBtn');
            if (count > 0) {
                warning.classList.remove('d-none');
                confirmBtn.disabled = true;
            } else {
                warning.classList.add('d-none');
                confirmBtn.disabled = false;
            }

            new bootstrap.Modal(document.getElementById('deleteCategoryModal')).show();
        }
    </script>

</th:block>

</body>
</html>
