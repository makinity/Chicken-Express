<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead}">
    <title>Order Detail — Admin | ChickenExpress</title>
</head>
<body th:replace="~{layout/admin-layout :: adminBody('Order Detail')}">

<th:block th:fragment="content">

        <!-- Back button + order number -->
        <div class="d-flex align-items-center gap-2 mb-4">
            <a th:href="@{/admin/orders}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="fw-bold fs-5"
                  th:text="'Order ' + ${order.orderNumber}">Order #</span>
        </div>

        <!-- Flash -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">

            <!-- Order Info -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header ce-card-header fw-bold">Order Items</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item py-3 px-4"
                            th:each="item : ${order.orderItems}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="fw-medium" th:text="${item.product.name}">Item</span>
                                    <span class="text-muted small ms-2"
                                          th:text="'×' + ${item.quantity}">×1</span>
                                </div>
                                <span class="fw-bold"
                                      th:text="'₱' + ${#numbers.formatDecimal(item.subtotal,1,2)}">₱0.00</span>
                            </div>
                        </li>
                        <li class="list-group-item py-3 px-4 bg-light">
                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span>Total</span>
                                <span class="ce-color-primary"
                                      th:text="'₱' + ${#numbers.formatDecimal(order.totalAmount,1,2)}">₱0.00</span>
                            </div>
                        </li>
                    </ul>
                </div>

                <div th:if="${order.notes}" class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <strong>Special Instructions:</strong>
                        <p class="mb-0 mt-1 text-muted" th:text="${order.notes}">Notes</p>
                    </div>
                </div>
            </div>

            <!-- Actions Sidebar -->
            <div class="col-md-4">

                <!-- Order status -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-3">Order Status</h6>

                        <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select name="status" class="form-select mb-2">
                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s}"
                                        th:selected="${order.status == s}">Status</option>
                            </select>
                            <button type="submit" class="btn ce-btn-primary w-100">Update Status</button>
                        </form>
                    </div>
                </div>

                <!-- Payment status -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-3">Payment</h6>
                        <div th:if="${order.payment != null}">
                            <span class="badge mb-2"
                                  th:classappend="${order.payment.status.name() == 'PAID'} ? 'bg-success' :
                                                   (${order.payment.status.name() == 'FAILED'} ? 'bg-danger' : 'bg-secondary')"
                                  th:text="${order.payment.status}">PAID</span>
                            <div class="small text-muted"
                                 th:if="${order.payment.paymentMethod}"
                                 th:text="'via ' + ${order.payment.paymentMethod}"></div>
                        </div>
                        <span th:unless="${order.payment != null}" class="text-muted small">No payment record.</span>

                        <form th:action="@{/admin/orders/{id}/mark-paid(id=${order.id})}"
                              method="post" class="mt-3">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-success w-100 btn-sm">
                                <i class="bi bi-check-circle"></i> Mark as Paid
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Customer info -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-2">Customer</h6>
                        <div class="fw-medium" th:text="${order.user.fullName}">Name</div>
                        <div class="small text-muted" th:text="${order.user.email}">email</div>
                        <div class="small text-muted mt-1"
                             th:text="${order.orderType} + (${order.deliveryAddress != null} ? (' → ' + ${order.deliveryAddress}) : '')">
                        </div>
                    </div>
                </div>

            </div>
        </div>

</th:block>

</body>
</html>
