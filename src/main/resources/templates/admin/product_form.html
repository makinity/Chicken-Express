<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead}">
    <title th:text="${product != null} ? 'Edit Product' : 'Add Product'">Product Form — Admin | ChickenExpress</title>
</head>
<body th:replace="~{layout/admin-layout :: adminBody('Product Form')}">

<th:block th:fragment="content">

        <h1 class="h2 fw-bold mb-4"
            th:text="${product != null} ? 'Edit Product' : 'Add New Product'">
            Product Form
        </h1>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form th:action="${product != null} ? @{/admin/products/{id}/edit(id=${product.id})} : @{/admin/products/new}"
                      method="post"
                      enctype="multipart/form-data"
                      th:object="${form}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-medium">Product Name *</label>
                        <input id="name" type="text" class="form-control"
                               th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-medium">Description</label>
                        <textarea id="description" class="form-control" rows="3"
                                  th:field="*{description}"
                                  placeholder="Short description of the product..."></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="price" class="form-label fw-medium">Price (₱) *</label>
                            <input id="price" type="number" step="0.01" min="1"
                                   class="form-control"
                                   th:field="*{price}"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}"
                                 th:errors="*{price}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="categoryId" class="form-label fw-medium">Category *</label>
                            <select id="categoryId" class="form-select" th:field="*{categoryId}"
                                    th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                                <option value="">Select category...</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}">Category</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}"
                                 th:errors="*{categoryId}"></div>
                        </div>
                    </div>

                    <!-- Image upload -->
                    <div class="mb-3">
                        <label for="imageFile" class="form-label fw-medium">
                            Product Image
                            <span class="text-muted fw-normal">(JPEG/PNG, max 5 MB)</span>
                        </label>
                        <input id="imageFile" name="imageFile" type="file"
                               class="form-control" accept="image/*"/>
                        <div th:if="${product?.imageUrl != null}" class="mt-2">
                            <img th:src="${product.imageUrl}" class="rounded"
                                 style="width:80px;height:80px;object-fit:cover;"
                                 alt="Current image"/>
                            <small class="text-muted ms-2">Current image (leave blank to keep)</small>
                        </div>
                    </div>

                    <!-- Flags -->
                    <div class="row g-3 mb-4">
                        <div class="col-auto">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="available"
                                       th:field="*{available}"/>
                                <label class="form-check-label" for="available">Available</label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="popular"
                                       th:field="*{popular}"/>
                                <label class="form-check-label" for="popular">
                                    <i class="bi bi-star-fill ce-color-accent"></i> Popular
                                </label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="spicy"
                                       th:field="*{spicy}"/>
                                <label class="form-check-label" for="spicy">🌶 Spicy</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn ce-btn-primary px-4">
                            <i class="bi bi-save"></i>
                            <span th:text="${product != null} ? 'Update Product' : 'Save Product'">Save</span>
                        </button>
                        <a th:href="@{/admin/products}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>

</th:block>

</body>
</html>
