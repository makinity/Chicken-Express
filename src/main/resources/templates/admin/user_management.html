<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead}">
    <title>Users — Admin | ChickenExpress</title>
</head>
<body th:replace="~{layout/admin-layout :: adminBody('Users')}">

<th:block th:fragment="content">

        <!-- Flash -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Search bar -->
        <div class="d-flex justify-content-end mb-3">
            <div class="input-group" style="max-width: 300px;">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" id="userSearch" class="form-control border-start-0 ps-0"
                       placeholder="Search by name or email…"
                       autocomplete="off"/>
                <button class="btn btn-outline-secondary" type="button" id="clearUserSearch"
                        style="display:none;" title="Clear">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Registered</th>
                            <th>Status</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr th:each="user : ${users}"
                            data-user-row
                            th:data-name="${user.fullName}"
                            th:data-email="${user.email}">
                            <td class="fw-medium" th:text="${user.fullName}">Name</td>
                            <td class="small text-muted" th:text="${user.email}">email@</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.role == 'ROLE_ADMIN'} ? 'ce-badge-primary' : 'bg-secondary'"
                                      th:text="${user.role == 'ROLE_ADMIN'} ? 'Admin' : 'Customer'">Role</span>
                            </td>
                            <td class="small text-muted"
                                th:text="${#temporals.format(user.createdAt,'MMM d, yyyy')}">Jan 1, 2024</td>
                            <td>
                                <span th:if="${user.enabled}" class="badge bg-success">Active</span>
                                <span th:unless="${user.enabled}" class="badge bg-danger">Disabled</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/admin/users/{id}/toggle-enabled(id=${user.id})}"
                                      method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            th:classappend="${user.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                                            class="btn btn-sm">
                                        <span th:text="${user.enabled} ? 'Deactivate' : 'Activate'">Toggle</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr id="noUserSearchResults" style="display:none;">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-search me-1"></i> No users match your search.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

</th:block>

<script>
    (function () {
        const searchInput = document.getElementById('userSearch');
        const clearBtn    = document.getElementById('clearUserSearch');
        const tbody       = document.getElementById('userTableBody');
        const noResults   = document.getElementById('noUserSearchResults');

        searchInput.addEventListener('input', filterTable);
        clearBtn.addEventListener('click', function () {
            searchInput.value = '';
            filterTable();
            searchInput.focus();
        });

        function filterTable() {
            const query = searchInput.value.trim().toLowerCase();
            clearBtn.style.display = query ? 'inline-block' : 'none';

            const rows = tbody.querySelectorAll('tr[data-user-row]');
            let visibleCount = 0;

            rows.forEach(function (row) {
                const name  = (row.dataset.name  || '').toLowerCase();
                const email = (row.dataset.email || '').toLowerCase();
                const matches = !query || name.includes(query) || email.includes(query);
                row.style.display = matches ? '' : 'none';
                if (matches) visibleCount++;
            });

            noResults.style.display = (query && visibleCount === 0) ? '' : 'none';
        }
    })();
</script>

</body>
</html>
