<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead}">
    <title>Users — Admin | ChickenExpress</title>
</head>
<body th:replace="~{layout/admin-layout :: adminBody('Users')}">

<th:block th:fragment="content">

    <!-- ── Toolbar ─────────────────────────────────────────────────────── -->
    <div class="d-flex justify-content-end mb-4">
        <div class="input-group flex-nowrap" style="max-width: 300px; width: 100%;">
            <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text" id="userSearch" class="form-control border-start-0 ps-0"
                   placeholder="Search by name or email…" autocomplete="off"/>
            <button class="btn btn-outline-secondary" type="button" id="clearUserSearch"
                    style="display:none;" title="Clear">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>

    <!-- Flash -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show mb-3">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ── Empty state ─────────────────────────────────────────────────── -->
    <div th:if="${users.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-people display-4"></i>
        <p class="mt-3">No users found.</p>
    </div>

    <!-- ── User cards ──────────────────────────────────────────────────── -->
    <div id="userGrid" class="row g-3" th:unless="${users.isEmpty()}">
        <div class="col-12 col-md-6 col-xl-4 user-card-col"
             th:each="user : ${users}"
             th:data-name="${user.fullName}"
             th:data-email="${user.email}">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-3">
                    <!-- Top: avatar + name + role -->
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                             style="width:44px;height:44px;background:var(--primary-light);">
                            <i class="bi bi-person-fill ce-color-primary fs-5"></i>
                        </div>
                        <div class="flex-grow-1 min-width-0">
                            <div class="fw-semibold text-truncate" th:text="${user.fullName}">Name</div>
                            <div class="text-muted small text-truncate" th:text="${user.email}">email@</div>
                        </div>
                        <span class="badge flex-shrink-0"
                              th:classappend="${user.role == 'ROLE_ADMIN'} ? 'ce-badge-primary' : 'bg-secondary'"
                              th:text="${user.role == 'ROLE_ADMIN'} ? 'Admin' : 'Customer'">Role</span>
                    </div>

                    <!-- Bottom: registered + status + action -->
                    <div class="d-flex align-items-center justify-content-between pt-2 border-top flex-wrap gap-2">
                        <div>
                            <div class="text-muted" style="font-size:.72rem;">Registered</div>
                            <div class="small fw-medium"
                                 th:text="${#temporals.format(user.createdAt,'MMM d, yyyy')}">Jan 1, 2024</div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span th:if="${user.enabled}" class="badge bg-success">Active</span>
                            <span th:unless="${user.enabled}" class="badge bg-danger">Disabled</span>
                            <form th:action="@{/admin/users/{id}/toggle-enabled(id=${user.id})}"
                                  method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${user.enabled} ? 'btn-outline-danger' : 'btn-outline-success'">
                                    <span th:text="${user.enabled} ? 'Deactivate' : 'Activate'">Toggle</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- No search results -->
    <div id="noUserSearchResults" class="text-center text-muted py-5" style="display:none;">
        <i class="bi bi-search display-6"></i>
        <p class="mt-2">No users match your search.</p>
    </div>

    <!-- ── Pagination ───────────────────────────────────────────────────── -->
    <div id="paginationWrap" class="d-flex align-items-center justify-content-between mt-4 flex-wrap gap-2"
         th:unless="${users.isEmpty()}">
        <div class="text-muted small" id="pageInfo"></div>
        <nav aria-label="Users pagination">
            <ul class="pagination ce-pagination mb-0" id="pagination"></ul>
        </nav>
    </div>

    <script>
    (function () {
        const PAGE_SIZE = 15;
        let currentPage = 1;
        let filteredCols = [];

        const searchInput = document.getElementById('userSearch');
        const clearBtn    = document.getElementById('clearUserSearch');
        const grid        = document.getElementById('userGrid');
        const noResults   = document.getElementById('noUserSearchResults');
        const pageInfo    = document.getElementById('pageInfo');
        const pagination  = document.getElementById('pagination');

        if (!grid) return;

        const allCols = Array.from(grid.querySelectorAll('.user-card-col'));

        searchInput.addEventListener('input', function () { currentPage = 1; applyFilter(); });
        clearBtn.addEventListener('click', function () {
            searchInput.value = ''; currentPage = 1; applyFilter(); searchInput.focus();
        });

        function applyFilter() {
            const query = searchInput.value.trim().toLowerCase();
            clearBtn.style.display = query ? 'inline-block' : 'none';
            filteredCols = allCols.filter(function (col) {
                const name  = (col.dataset.name  || '').toLowerCase();
                const email = (col.dataset.email || '').toLowerCase();
                return !query || name.includes(query) || email.includes(query);
            });
            noResults.style.display = (query && filteredCols.length === 0) ? '' : 'none';
            renderPage();
        }

        function renderPage() {
            const total      = filteredCols.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            currentPage      = Math.min(currentPage, totalPages);
            const start = (currentPage - 1) * PAGE_SIZE;
            const end   = start + PAGE_SIZE;

            allCols.forEach(col => col.style.display = 'none');
            filteredCols.forEach((col, i) => { col.style.display = (i >= start && i < end) ? '' : 'none'; });

            pageInfo.textContent = total > 0
                ? 'Showing ' + (start + 1) + '–' + Math.min(end, total) + ' of ' + total + ' users'
                : '';

            pagination.innerHTML = '';
            if (totalPages <= 1) return;

            const prevLi = document.createElement('li');
            prevLi.className = 'page-item' + (currentPage === 1 ? ' disabled' : '');
            prevLi.innerHTML = '<a class="page-link" href="#">&laquo;</a>';
            prevLi.addEventListener('click', e => { e.preventDefault(); if (currentPage > 1) { currentPage--; renderPage(); } });
            pagination.appendChild(prevLi);

            pageRange(currentPage, totalPages).forEach(function (p) {
                const li = document.createElement('li');
                if (p === '...') {
                    li.className = 'page-item disabled';
                    li.innerHTML = '<span class="page-link">…</span>';
                } else {
                    li.className = 'page-item' + (p === currentPage ? ' active' : '');
                    li.innerHTML = '<a class="page-link" href="#">' + p + '</a>';
                    li.addEventListener('click', e => { e.preventDefault(); currentPage = p; renderPage(); });
                }
                pagination.appendChild(li);
            });

            const nextLi = document.createElement('li');
            nextLi.className = 'page-item' + (currentPage === totalPages ? ' disabled' : '');
            nextLi.innerHTML = '<a class="page-link" href="#">&raquo;</a>';
            nextLi.addEventListener('click', e => { e.preventDefault(); if (currentPage < totalPages) { currentPage++; renderPage(); } });
            pagination.appendChild(nextLi);
        }

        function pageRange(current, total) {
            if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
            const pages = [1];
            if (current > 3) pages.push('...');
            for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) pages.push(i);
            if (current < total - 2) pages.push('...');
            pages.push(total);
            return pages;
        }

        filteredCols = allCols.slice();
        renderPage();
    })();
    </script>

</th:block>

</body>
</html>
