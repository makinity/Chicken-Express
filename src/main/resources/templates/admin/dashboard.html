<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/admin-layout :: adminHead}">
    <title>Dashboard — Admin | ChickenExpress</title>
</head>
<body th:replace="~{layout/admin-layout :: adminBody('Dashboard')}">

<th:block th:fragment="content">

    <!-- ── Order + Customer Stats ──────────────────────────────────────── -->
    <div class="row g-3 mb-3">
        <div class="col-6 col-xl-3">
            <div class="card border-0 shadow-sm ce-stat-card ce-stat-green h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-bag-check display-5 opacity-75"></i>
                    <div>
                        <div class="fw-bold fs-2" th:text="${totalOrders}">0</div>
                        <div class="text-muted small">Total Orders</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card border-0 shadow-sm ce-stat-card ce-stat-amber h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-calendar-day display-5 opacity-75"></i>
                    <div>
                        <div class="fw-bold fs-2" th:text="${todayOrders}">0</div>
                        <div class="text-muted small">Today's Orders</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card border-0 shadow-sm ce-stat-card ce-stat-green h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-egg-fried display-5 opacity-75"></i>
                    <div>
                        <div class="fw-bold fs-2" th:text="${totalProducts}">0</div>
                        <div class="text-muted small">Menu Items</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card border-0 shadow-sm ce-stat-card ce-stat-amber h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-people display-5 opacity-75"></i>
                    <div>
                        <div class="fw-bold fs-2" th:text="${totalUsers}">0</div>
                        <div class="text-muted small">Customers</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Revenue Stats ────────────────────────────────────────────────── -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
            <div class="card border-0 shadow-sm ce-stat-card ce-stat-revenue h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-cash-coin display-5 opacity-75 ce-color-primary"></i>
                    <div>
                        <div class="fw-bold fs-4 ce-color-primary"
                             th:text="'₱' + ${#numbers.formatDecimal(totalRevenue, 1, 2)}">₱0.00</div>
                        <div class="text-muted small">Total Revenue</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card border-0 shadow-sm ce-stat-card ce-stat-revenue h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-graph-up-arrow display-5 opacity-75 ce-color-accent"></i>
                    <div>
                        <div class="fw-bold fs-4 ce-color-accent"
                             th:text="'₱' + ${#numbers.formatDecimal(todayRevenue, 1, 2)}">₱0.00</div>
                        <div class="text-muted small">Today's Revenue</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card border-0 shadow-sm ce-stat-card ce-stat-revenue h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-calendar-month display-5 opacity-75 ce-color-primary"></i>
                    <div>
                        <div class="fw-bold fs-4 ce-color-primary"
                             th:text="'₱' + ${#numbers.formatDecimal(monthRevenue, 1, 2)}">₱0.00</div>
                        <div class="text-muted small">This Month</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Charts Row ────────────────────────────────────────────────────── -->
    <div class="row g-3 mb-4">

        <!-- 7-day Sales Line Chart -->
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header ce-card-header fw-bold">
                    <i class="bi bi-graph-up"></i> Revenue — Last 7 Days
                </div>
                <div class="card-body">
                    <canvas id="salesChart" height="110"></canvas>
                </div>
            </div>
        </div>

        <!-- Orders by Status Doughnut -->
        <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header ce-card-header fw-bold">
                    <i class="bi bi-pie-chart"></i> Orders by Status
                </div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <canvas id="statusChart" height="180"></canvas>
                </div>
            </div>
        </div>

    </div>

    <!-- ── Top Products + Order Queues ──────────────────────────────────── -->
    <div class="row g-3">

        <!-- Top 5 Products Bar Chart -->
        <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header ce-card-header fw-bold">
                    <i class="bi bi-trophy"></i> Top 5 Products
                </div>
                <div class="card-body">
                    <canvas id="topProductsChart" height="200"></canvas>
                </div>
            </div>
        </div>

        <!-- Pending Orders -->
        <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header ce-card-header fw-bold">
                    <i class="bi bi-clock-history"></i> Pending
                    <span class="badge bg-secondary ms-1" th:text="${pendingOrders.size()}">0</span>
                </div>
                <div class="list-group list-group-flush" th:if="${!pendingOrders.isEmpty()}">
                    <a th:each="order : ${pendingOrders}"
                       th:href="@{/admin/orders/{id}(id=${order.id})}"
                       class="list-group-item list-group-item-action py-2 px-3">
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold small" th:text="${order.orderNumber}">CE-001</span>
                            <span class="text-muted small"
                                  th:text="${#temporals.format(order.createdAt,'HH:mm')}">12:00</span>
                        </div>
                        <div class="text-muted small"
                             th:text="${order.user.fullName} + ' · ₱' + ${#numbers.formatDecimal(order.totalAmount,1,2)}">
                        </div>
                    </a>
                </div>
                <div th:if="${pendingOrders.isEmpty()}"
                     class="card-body text-muted text-center small py-4">
                    No pending orders.
                </div>
            </div>
        </div>

        <!-- Now Preparing -->
        <div class="col-12 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header ce-card-header fw-bold">
                    <i class="bi bi-fire"></i> Preparing
                    <span class="badge bg-warning text-dark ms-1" th:text="${preparingOrders.size()}">0</span>
                </div>
                <div class="list-group list-group-flush" th:if="${!preparingOrders.isEmpty()}">
                    <a th:each="order : ${preparingOrders}"
                       th:href="@{/admin/orders/{id}(id=${order.id})}"
                       class="list-group-item list-group-item-action py-2 px-3">
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold small" th:text="${order.orderNumber}">CE-001</span>
                            <span class="text-muted small"
                                  th:text="${#temporals.format(order.createdAt,'HH:mm')}">12:00</span>
                        </div>
                        <div class="text-muted small"
                             th:text="'₱' + ${#numbers.formatDecimal(order.totalAmount,1,2)}">
                        </div>
                    </a>
                </div>
                <div th:if="${preparingOrders.isEmpty()}"
                     class="card-body text-muted text-center small py-4">
                    No orders being prepared.
                </div>
            </div>
        </div>

    </div><!-- /.row bottom -->

    <!-- ── Embedded chart data (server-rendered JSON) ───────────────────── -->
    <script type="application/json" id="salesData"
            th:inline="javascript">
        { "labels": /*[[${salesLabels}]]*/ [], "values": /*[[${salesValues}]]*/ [] }
    </script>
    <script type="application/json" id="statusData"
            th:inline="javascript">
        { "labels": /*[[${statusLabels}]]*/ [], "values": /*[[${statusValues}]]*/ [] }
    </script>
    <script type="application/json" id="topProductsData"
            th:inline="javascript">
        { "labels": /*[[${topProductLabels}]]*/ [], "values": /*[[${topProductValues}]]*/ [] }
    </script>

    <!-- Chart.js + dashboard init -->
    <script th:src="@{/js/chart.umd.min.js}"></script>
    <script th:src="@{/js/dashboard-charts.js}"></script>

</th:block>

</body>
</html>
