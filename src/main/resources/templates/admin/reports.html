<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead}">
    <title>Reports — Admin | ChickenExpress</title>
</head>
<body th:replace="~{layout/admin-layout :: adminBody('Reports')}">

<th:block th:fragment="content">

        <!-- ── Sales Report ── -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header ce-card-header fw-bold">
                <i class="bi bi-file-earmark-excel"></i> Sales Report (Excel)
            </div>
            <div class="card-body p-4">
                <p class="text-muted small">
                    Download a sales report for a specific date range as an Excel (.xlsx) file.
                </p>
                <form th:action="@{/admin/reports/sales/xlsx}" method="get" class="row g-3">
                    <div class="col-md-5">
                        <label for="from" class="form-label fw-medium">From</label>
                        <input id="from" name="from" type="date" class="form-control"
                               th:value="${today}"
                               required/>
                    </div>
                    <div class="col-md-5">
                        <label for="to" class="form-label fw-medium">To</label>
                        <input id="to" name="to" type="date" class="form-control"
                               th:value="${today}"
                               required/>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn ce-btn-primary w-100">
                            <i class="bi bi-download"></i> Download
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ── PDF (coming soon) ── -->
        <div class="card border-0 shadow-sm opacity-50">
            <div class="card-header fw-bold">
                <i class="bi bi-file-earmark-pdf"></i> PDF Reports
                <span class="badge bg-secondary ms-2">Coming Soon</span>
            </div>
            <div class="card-body text-muted small p-4">
                PDF receipt generation and PDF sales reports via JasperReports
                will be available in a future update.
            </div>
        </div>

</th:block>

</body>
</html>
