<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/header :: head}">
    <title>Menu — ChickenExpress</title>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">

        <!-- ── Hero Banner ──────────────────────────────────────────────── -->
        <div class="ce-hero-banner rounded-3 p-4 p-md-5 mb-4 text-white">
            <h1 class="display-5 fw-bold mb-1">
                <i class="bi bi-egg-fried"></i> Our Menu
            </h1>
            <p class="lead mb-3">Fresh, crispy chicken &mdash; made to order.</p>

            <!-- Search form -->
            <form th:action="@{/menu}" method="get" class="d-flex" style="max-width:460px;">
                <input type="text" name="search" class="form-control me-2"
                       placeholder="Search chicken meals, sides..." aria-label="Search menu"
                       th:value="${search}"/>
                <button type="submit" class="btn btn-light fw-medium">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>

        <!-- Flash message -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">

            <!-- ── Category Sidebar ────────────────────────────────────── -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-header ce-card-header fw-bold">
                        <i class="bi bi-funnel"></i> Categories
                    </div>
                    <div class="list-group list-group-flush">
                        <a th:href="@{/menu}"
                           class="list-group-item list-group-item-action"
                           th:classappend="${search == null and activeCategoryId == null} ? 'active ce-list-active' : ''">
                            All Items
                        </a>
                        <a th:each="cat : ${categories}"
                           th:href="@{/menu(categoryId=${cat.id})}"
                           th:text="${cat.name}"
                           class="list-group-item list-group-item-action"
                           th:classappend="${activeCategoryId == cat.id} ? 'active ce-list-active' : ''">
                            Category
                        </a>
                    </div>
                </div>
            </div>

            <!-- ── Product Grid ────────────────────────────────────────── -->
            <div class="col-lg-9">

                <!-- No results -->
                <div th:if="${products.isEmpty()}" class="text-center py-5 text-muted">
                    <i class="bi bi-search display-4"></i>
                    <p class="mt-3">No items found. Try a different search or category.</p>
                </div>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4">
                    <div class="col" th:each="product : ${products}">
                        <div class="card h-100 border-0 shadow-sm ce-product-card">

                            <!-- Product image -->
                            <div class="ce-product-img-wrapper">
                                <img th:if="${product.imageUrl != null}"
                                     th:src="${product.imageUrl}"
                                     th:alt="${product.name}"
                                     class="card-img-top ce-product-img"
                                     loading="lazy"/>
                                <div th:unless="${product.imageUrl != null}"
                                     class="ce-product-img-placeholder d-flex align-items-center justify-content-center">
                                    <i class="bi bi-egg-fried display-5 text-muted"></i>
                                </div>

                                <!-- Badges -->
                                <div class="position-absolute top-0 start-0 p-2">
                                    <span th:if="${product.popular}"
                                          class="badge ce-badge-accent me-1">
                                        <i class="bi bi-star-fill"></i> Popular
                                    </span>
                                    <span th:if="${product.spicy}"
                                          class="badge ce-badge-danger">
                                        🌶 Spicy
                                    </span>
                                </div>
                            </div>

                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold mb-1" th:text="${product.name}">
                                    Product Name
                                </h5>
                                <p class="card-text text-muted small flex-grow-1"
                                   th:text="${product.description}">
                                    Description
                                </p>
                                <div class="d-flex align-items-center justify-content-between mt-2">
                                    <span class="fw-bold fs-5 ce-color-primary"
                                          th:text="'₱' + ${#numbers.formatDecimal(product.price, 1, 2)}">
                                        ₱0.00
                                    </span>

                                    <!-- Add to cart (authenticated users only) -->
                                    <form th:action="@{/cart/add}" method="post"
                                          sec:authorize="isAuthenticated()">
                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}"/>
                                        <input type="hidden" name="productId"
                                               th:value="${product.id}"/>
                                        <input type="hidden" name="quantity" value="1"/>
                                        <button type="submit" class="btn btn-sm ce-btn-primary">
                                            <i class="bi bi-cart-plus"></i> Add
                                        </button>
                                    </form>

                                    <!-- Login prompt for guests -->
                                    <a th:href="@{/login}" class="btn btn-sm btn-outline-secondary"
                                       sec:authorize="!isAuthenticated()">
                                        Login to Order
                                    </a>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div><!-- /.row -->
    </div><!-- /.container -->
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
