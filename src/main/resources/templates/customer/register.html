<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title>Create Account — ChickenExpress</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-sm border-0" style="width: 100%; max-width: 460px;">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <i class="bi bi-person-plus display-4 ce-color-primary"></i>
                <h1 class="h3 mt-2 fw-bold">Create an account</h1>
                <p class="text-muted small">Join ChickenExpress and start ordering!</p>
            </div>

            <!-- Alert messages -->
            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>

            <form th:action="@{/register}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label for="fullName" class="form-label fw-medium">Full Name</label>
                    <input id="fullName" name="fullName" type="text" class="form-control"
                           placeholder="Juan dela Cruz" autofocus required/>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-medium">Email address</label>
                    <input id="email" name="email" type="email" class="form-control"
                           placeholder="you@example.com" required/>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-medium">Password</label>
                    <div class="input-group">
                        <input id="password" name="password" type="password" class="form-control"
                               placeholder="Minimum 8 characters" minlength="8" required/>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                tabindex="-1" title="Show/hide password">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-medium">Confirm Password</label>
                    <div class="input-group">
                        <input id="confirmPassword" name="confirmPassword" type="password"
                               class="form-control" placeholder="Repeat your password"
                               minlength="8" required/>
                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword"
                                tabindex="-1" title="Show/hide password">
                            <i class="bi bi-eye" id="toggleConfirmPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn ce-btn-primary w-100 fw-medium py-2">
                    Create Account
                </button>
            </form>

            <hr class="my-4"/>

            <p class="text-center small mb-0">
                Already have an account?
                <a th:href="@{/login}" class="ce-link fw-medium">Sign in</a>
            </p>

        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

<script>
    function togglePasswordField(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }

    document.getElementById('togglePassword')
        .addEventListener('click', () => togglePasswordField('password', 'togglePasswordIcon'));

    document.getElementById('toggleConfirmPassword')
        .addEventListener('click', () => togglePasswordField('confirmPassword', 'toggleConfirmPasswordIcon'));
</script>

</body>
</html>
