<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title>Order Details — ChickenExpress</title>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container" style="max-width: 760px;">

        <!-- Back link -->
        <a th:href="@{/orders}" class="btn btn-sm btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left"></i> Back to Orders
        </a>

        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
            <div>
                <h1 class="h3 fw-bold mb-0">
                    <i class="bi bi-receipt"></i>
                    Order <span th:text="${order.orderNumber}">CE-00001</span>
                </h1>
                <small class="text-muted"
                       th:text="${#temporals.format(order.createdAt, 'MMMM d, yyyy — HH:mm')}">
                    August 13, 2026 — 11:30
                </small>
            </div>

            <!-- Order status badge -->
            <span class="badge fs-6 px-3 py-2"
                  th:classappend="${order.status.name() == 'COMPLETED'} ? 'bg-success' :
                                  (${order.status.name() == 'CANCELLED'}  ? 'bg-danger' :
                                  (${order.status.name() == 'PREPARING'}  ? 'bg-warning text-dark' :
                                  (${order.status.name() == 'READY'}      ? 'bg-info text-dark' : 'bg-secondary')))"
                  th:text="${order.status}">
                PENDING
            </span>
        </div>

        <!-- Order info card -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-sm-4">
                        <div class="text-muted small mb-1">Order Type</div>
                        <div class="fw-semibold">
                            <i class="bi"
                               th:classappend="${order.orderType.name() == 'DELIVERY'} ? 'bi-bicycle' :
                                              (${order.orderType.name() == 'DINE_IN'}  ? 'bi-grid-3x3-gap' : 'bi-bag')"></i>
                            <span th:text="${order.orderType.name().replace('_', ' ')}">TAKEOUT</span>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="text-muted small mb-1">Payment</div>
                        <div class="fw-semibold">
                            <span th:if="${order.payment != null}">
                                <span class="badge"
                                      th:classappend="${order.payment.status.name() == 'PAID'}   ? 'bg-success' :
                                                      (${order.payment.status.name() == 'FAILED'} ? 'bg-danger' : 'bg-secondary')"
                                      th:text="${order.payment.status}">PAID</span>
                                <span th:if="${order.payment.paymentMethod != null}"
                                      class="text-muted small ms-1"
                                      th:text="'via ' + ${order.payment.paymentMethod}">via gcash</span>
                            </span>
                            <span th:unless="${order.payment != null}" class="text-muted">—</span>
                        </div>
                    </div>
                    <div class="col-sm-4"
                         th:if="${order.deliveryAddress != null and !order.deliveryAddress.isBlank()}">
                        <div class="text-muted small mb-1">Delivery Address</div>
                        <div class="fw-semibold" th:text="${order.deliveryAddress}">—</div>
                    </div>
                </div>

                <!-- Special instructions -->
                <div th:if="${order.notes != null and !order.notes.isBlank()}" class="mt-3 pt-3 border-top">
                    <div class="text-muted small mb-1">
                        <i class="bi bi-chat-left-text"></i> Special Instructions
                    </div>
                    <div class="fst-italic" th:text="${order.notes}">None</div>
                </div>
            </div>
        </div>

        <!-- Order items -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold border-bottom py-3">
                <i class="bi bi-basket"></i> Items Ordered
            </div>
            <div class="list-group list-group-flush">
                <div class="list-group-item px-4 py-3 d-flex align-items-center gap-3"
                     th:each="item : ${order.orderItems}">

                    <!-- Product image -->
                    <img th:if="${item.product.imageUrl != null}"
                         th:src="${item.product.imageUrl}"
                         alt="Product"
                         style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0;"/>
                    <div th:unless="${item.product.imageUrl != null}"
                         style="width:52px;height:52px;border-radius:8px;background:#f0f0f0;flex-shrink:0;
                                display:flex;align-items:center;justify-content:center;">
                        <i class="bi bi-egg-fried text-muted fs-5"></i>
                    </div>

                    <div class="flex-grow-1">
                        <div class="fw-semibold" th:text="${item.product.name}">Crispy Chicken</div>
                        <div class="text-muted small">
                            ₱<span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">0.00</span>
                            &times;
                            <span th:text="${item.quantity}">1</span>
                        </div>
                    </div>

                    <div class="fw-bold">
                        ₱<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span>
                    </div>
                </div>
            </div>

            <!-- Total -->
            <div class="card-footer bg-white border-top py-3">
                <div class="d-flex justify-content-between align-items-center px-2">
                    <span class="fw-semibold">Total</span>
                    <span class="fw-bold fs-5 ce-color-primary">
                        ₱<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="d-flex gap-2 justify-content-end">
            <a th:href="@{/menu}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-repeat"></i> Order Again
            </a>
            <a th:href="@{/orders}" class="btn ce-btn-primary">
                <i class="bi bi-list-ul"></i> All Orders
            </a>
        </div>

    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
