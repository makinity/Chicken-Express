<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title>Your Cart — ChickenExpress</title>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">
        <h1 class="h2 fw-bold mb-4"><i class="bi bi-cart3"></i> Your Cart</h1>

        <!-- Empty cart -->
        <div th:if="${cartItems.isEmpty()}" class="text-center py-5">
            <i class="bi bi-cart-x display-4 text-muted"></i>
            <p class="mt-3 text-muted">Your cart is empty.</p>
            <a th:href="@{/menu}" class="btn ce-btn-primary">
                <i class="bi bi-grid-3x3-gap"></i> Browse Menu
            </a>
        </div>

        <div th:unless="${cartItems.isEmpty()}" class="row g-4">

            <!-- Cart Items -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <ul class="list-group list-group-flush">

                        <li class="list-group-item py-3 px-4"
                            th:each="item : ${cartItems}">
                            <div class="d-flex align-items-center gap-3">

                                <!-- Image -->
                                <img th:if="${item.product.imageUrl != null}"
                                     th:src="${item.product.imageUrl}"
                                     class="rounded" style="width:64px;height:64px;object-fit:cover;"
                                     th:alt="${item.product.name}"/>
                                <div th:unless="${item.product.imageUrl != null}"
                                     class="rounded bg-light d-flex align-items-center justify-content-center"
                                     style="width:64px;height:64px;">
                                    <i class="bi bi-egg-fried text-muted fs-4"></i>
                                </div>

                                <!-- Info -->
                                <div class="flex-grow-1">
                                    <div class="fw-bold" th:text="${item.product.name}">Item</div>
                                    <div class="text-muted small"
                                         th:text="'₱' + ${#numbers.formatDecimal(item.product.price,1,2)}">
                                        ₱0.00
                                    </div>
                                </div>

                                <!-- Quantity -->
                                <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                                    <input type="number" name="quantity" min="1" max="99"
                                           th:value="${item.quantity}"
                                           class="form-control form-control-sm text-center"
                                           style="width:70px;"
                                           onchange="this.form.submit()"/>
                                </form>

                                <!-- Subtotal -->
                                <div class="fw-bold text-end" style="min-width:80px;"
                                     th:text="'₱' + ${#numbers.formatDecimal(item.product.price.multiply(#numbers.formatDecimal(item.quantity,1,0)),1,2)}">
                                    ₱0.00
                                </div>

                                <!-- Remove -->
                                <form th:action="@{/cart/remove}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>

                            </div>
                        </li>

                    </ul>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Order Summary</h5>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span th:text="'₱' + ${#numbers.formatDecimal(cartTotal,1,2)}">₱0.00</span>
                        </div>
                        <hr/>
                        <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
                            <span>Total</span>
                            <span class="ce-color-primary"
                                  th:text="'₱' + ${#numbers.formatDecimal(cartTotal,1,2)}">₱0.00</span>
                        </div>

                        <a th:href="@{/checkout}" class="btn ce-btn-primary w-100 py-2 fw-medium">
                            <i class="bi bi-lock"></i> Proceed to Checkout
                        </a>
                        <a th:href="@{/menu}" class="btn btn-outline-secondary w-100 mt-2">
                            Continue Shopping
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
