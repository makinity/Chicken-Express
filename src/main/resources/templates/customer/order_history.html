<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title>My Orders — ChickenExpress</title>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">
        <h1 class="h2 fw-bold mb-4"><i class="bi bi-receipt"></i> My Orders</h1>

        <!-- Empty state -->
        <div th:if="${orders.isEmpty()}" class="text-center py-5 text-muted">
            <i class="bi bi-bag-x display-4"></i>
            <p class="mt-3">You haven't placed any orders yet.</p>
            <a th:href="@{/menu}" class="btn ce-btn-primary">Start Ordering</a>
        </div>

        <div class="card border-0 shadow-sm" th:unless="${orders.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Order #</th>
                            <th>Date</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Payment</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td class="fw-mono small" th:text="${order.orderNumber}">CE-00001</td>
                            <td class="small text-muted"
                                th:text="${#temporals.format(order.createdAt, 'MMM d, yyyy HH:mm')}">
                                Jan 1, 2024 12:00
                            </td>
                            <td th:text="${order.orderItems.size()} + ' item(s)'">1 item(s)</td>
                            <td class="fw-bold"
                                th:text="'₱' + ${#numbers.formatDecimal(order.totalAmount,1,2)}">
                                ₱0.00
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${order.status.name() == 'COMPLETED'} ? 'bg-success' :
                                                      (${order.status.name() == 'CANCELLED'} ? 'bg-danger' :
                                                      (${order.status.name() == 'PREPARING'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                      th:text="${order.status}">
                                    Status
                                </span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:if="${order.payment != null}"
                                      th:classappend="${order.payment.status.name() == 'PAID'} ? 'bg-success' :
                                                      (${order.payment.status.name() == 'FAILED'} ? 'bg-danger' : 'bg-secondary')"
                                      th:text="${order.payment?.status}">
                                    PAID
                                </span>
                                <span th:unless="${order.payment != null}" class="text-muted small">—</span>
                            </td>
                            <td>
                                <a th:href="@{/orders/{id}(id=${order.id})}"
                                   class="btn btn-sm btn-outline-secondary">
                                    Details
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
