<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title>My Orders — ChickenExpress</title>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/header :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">
        <h1 class="h2 fw-bold mb-4"><i class="bi bi-receipt"></i> My Orders</h1>

        <!-- Empty state -->
        <div th:if="${orders.isEmpty()}" class="text-center py-5 text-muted">
            <i class="bi bi-bag-x display-4"></i>
            <p class="mt-3">You haven't placed any orders yet.</p>
            <a th:href="@{/menu}" class="btn ce-btn-primary">Start Ordering</a>
        </div>

        <div th:unless="${orders.isEmpty()}" class="d-flex flex-column gap-3">
            <a th:each="order : ${orders}"
               th:href="@{/orders/{id}(id=${order.id})}"
               class="card border-0 shadow-sm text-decoration-none ce-order-card">
                <div class="card-body py-3 px-3">

                    <!-- Row 1: order number + status badges -->
                    <div class="d-flex align-items-center justify-content-between mb-1">
                        <span class="fw-bold small ce-color-primary"
                              th:text="${order.orderNumber}">CE-00001</span>
                        <div class="d-flex gap-1">
                            <span class="badge"
                                  th:classappend="${order.status.name() == 'COMPLETED'}  ? 'bg-success' :
                                                  (${order.status.name() == 'CANCELLED'} ? 'bg-danger'  :
                                                  (${order.status.name() == 'PREPARING'} ? 'bg-warning text-dark' :
                                                  (${order.status.name() == 'READY'}     ? 'bg-info text-dark' : 'bg-secondary')))"
                                  th:text="${order.status}">Status</span>
                            <span class="badge"
                                  th:if="${order.payment != null}"
                                  th:classappend="${order.payment.status.name() == 'PAID'}   ? 'bg-success' :
                                                  (${order.payment.status.name() == 'FAILED'} ? 'bg-danger' : 'bg-secondary')"
                                  th:text="${order.payment?.status}">PAID</span>
                        </div>
                    </div>

                    <!-- Row 2: date + items + total -->
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="text-muted small">
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${#temporals.format(order.createdAt, 'MMM d, yyyy · h:mm a')}">Jan 1</span>
                        </div>
                        <div class="d-flex align-items-center gap-3 small">
                            <span class="text-muted">
                                <i class="bi bi-bag me-1"></i>
                                <span th:text="${order.orderItems.size()} + ' item(s)'">1 item(s)</span>
                            </span>
                            <span class="fw-bold"
                                  th:text="'₱' + ${#numbers.formatDecimal(order.totalAmount,1,2)}">₱0.00</span>
                        </div>
                    </div>

                </div>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
