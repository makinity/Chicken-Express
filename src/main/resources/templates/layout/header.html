<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: 'ChickenExpress'">ChickenExpress</title>

    <!-- Bootstrap 5 CSS (local) -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>

    <!-- Bootstrap Icons (local) -->
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}"/>

    <!-- ChickenExpress theme (colors, root variables) -->
    <link rel="stylesheet" th:href="@{/css/theme.css}"/>

    <!-- CSRF tokens for AJAX requests -->
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Page-specific stylesheet (optional) -->
    <th:block th:if="${extraCss}">
        <link rel="stylesheet" th:href="${extraCss}"/>
    </th:block>

    <!-- WebSocket topic for real-time notifications (customer channel — only when logged in) -->
    <meta th:if="${currentUserId != null}" name="ws-topic"
          th:content="'/topic/user/' + ${currentUserId}"/>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!--  NAVIGATION BAR                                                         -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<nav class="navbar navbar-expand-lg sticky-top ce-navbar" th:fragment="navbar">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand ce-navbar-brand" th:href="@{/}">
            <img th:src="@{/images/logo.png(v=2)}" alt="ChickenExpress" class="ce-navbar-logo"/>
        </a>

        <!-- Toggler for mobile -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav links -->
        <div class="collapse navbar-collapse pb-2 pb-lg-0" id="navbarMain">
            <ul class="navbar-nav me-auto gap-1">

                <!-- Menu -->
                <li class="nav-item">
                    <a class="nav-link ce-nav-link px-3" th:href="@{/menu}">
                        <i class="bi bi-grid-3x3-gap"></i> Menu
                    </a>
                </li>

                <!-- About -->
                <li class="nav-item">
                    <a class="nav-link ce-nav-link px-3" th:href="@{/#about}">
                        <i class="bi bi-info-circle"></i> About
                    </a>
                </li>

                <!-- Admin link (ROLE_ADMIN only) -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link ce-nav-link px-3" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2"></i> Admin
                    </a>
                </li>
            </ul>

            <!-- Right-side nav -->
            <ul class="navbar-nav ms-auto align-items-lg-center gap-2 mt-2 mt-lg-0">

                <!-- Cart (authenticated users) -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link ce-nav-link ce-nav-cart position-relative px-2" th:href="@{/cart}">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:if="${cartItemCount != null and cartItemCount > 0}"
                              th:text="${cartItemCount}">0</span>
                    </a>
                </li>

                <!-- Orders (authenticated users) -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link ce-nav-link px-3" th:href="@{/orders}">
                        <i class="bi bi-receipt"></i> Orders
                    </a>
                </li>

                <!-- Notification bell (authenticated users) -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()" id="ceNotifDropdown">
                    <button class="btn nav-link ce-nav-link position-relative px-2"
                            type="button" data-bs-toggle="dropdown"
                            aria-expanded="false" title="Notifications"
                            style="background:none;border:none;">
                        <i class="bi bi-bell fs-5"></i>
                        <span id="ceNotifBadge"
                              class="position-absolute top-0 start-100 translate-middle
                                     badge rounded-pill bg-danger"
                              style="display:none;font-size:.6rem;min-width:1.2rem;padding:2px 4px;">
                            0
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end p-0 shadow"
                         style="width:320px;max-height:420px;overflow:hidden;border-radius:.5rem;">
                        <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
                            <span class="fw-bold small">Notifications</span>
                            <span class="text-muted" style="font-size:.7rem;">Last 30</span>
                        </div>
                        <ul id="ceNotifList" class="list-unstyled mb-0"
                            style="max-height:360px;overflow-y:auto;"></ul>
                    </div>
                </li>

                <!-- User dropdown (authenticated users) -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link ce-nav-link ce-nav-user px-2 dropdown-toggle d-flex align-items-center gap-2"
                       href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <!-- Profile photo -->
                        <img th:if="${currentProfileImageUrl != null}"
                             th:src="${currentProfileImageUrl}"
                             alt="Avatar"
                             style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.6);"/>
                        <!-- Fallback icon -->
                        <i th:unless="${currentProfileImageUrl != null}"
                           class="bi bi-person-circle fs-5"></i>
                        <span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end ce-dropdown shadow-sm border-0 mt-2">
                        <li class="px-3 py-2 d-flex align-items-center gap-2">
                            <!-- Mini avatar in dropdown header -->
                            <img th:if="${currentProfileImageUrl != null}"
                                 th:src="${currentProfileImageUrl}"
                                 alt="Avatar"
                                 style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;"/>
                            <div th:unless="${currentProfileImageUrl != null}"
                                 style="width:36px;height:36px;border-radius:50%;background:var(--ce-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                <i class="bi bi-person text-white"></i>
                            </div>
                            <div>
                                <div class="fw-semibold small lh-sm" sec:authentication="name">User</div>
                                <div class="text-muted" style="font-size:.72rem;">View profile</div>
                            </div>
                        </li>
                        <li><hr class="dropdown-divider my-1"/></li>
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="bi bi-person me-2"></i>My Profile
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/orders}">
                                <i class="bi bi-receipt me-2"></i>My Orders
                            </a>
                        </li>
                        <li><hr class="dropdown-divider my-1"/></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <button class="dropdown-item text-danger" type="submit">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>

                <!-- Login / Sign Up (guests) -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn ce-navbar-login-btn rounded-pill px-3 py-1 fw-medium"
                       th:href="@{/login}">
                        Login
                    </a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn ce-navbar-signup-btn rounded-pill px-3 py-1 fw-bold"
                       th:href="@{/register}">
                        Sign Up
                    </a>
                </li>
            </ul>
        </div>

    </div>
</nav>

<!-- ── Real-time notification toast container (customer) ─────────────────── -->
<div id="ceNotifToastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"
     style="z-index: 9999;" sec:authorize="isAuthenticated()"></div>

<!-- SockJS + STOMP + notifications (only injected when a topic meta tag is present) -->
<th:block th:if="${currentUserId != null}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:src="@{/js/notifications.js(v=1)}"></script>
</th:block>

</body>
</html>
