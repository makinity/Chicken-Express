# ============================================================
#  ChickenExpress — Application Configuration
#  Sensitive values are loaded from environment variables.
#  Never hardcode credentials here.
# ============================================================

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── DataSource (MySQL) ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chickenexpress_db}?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Thymeleaf ───────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.request-context-attribute=httpServletRequest

# ── Spring Security ─────────────────────────────────────────
# Default in-memory user disabled; real users come from the DB.
spring.security.user.name=disabled
spring.security.user.password=disabled

# ── PayMongo ────────────────────────────────────────────────
paymongo.secret-key=${PAYMONGO_SECRET_KEY:}
paymongo.public-key=${PAYMONGO_PUBLIC_KEY:}
paymongo.webhook-secret=${PAYMONGO_WEBHOOK_SECRET:}
paymongo.base-url=https://api.paymongo.com/v1
paymongo.success-url=${APP_BASE_URL:http://localhost:8080}/checkout/success
paymongo.cancel-url=${APP_BASE_URL:http://localhost:8080}/checkout/cancel

# ── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Seed / Data Initializer ──────────────────────────────────
# Set to true to wipe all data and re-seed on startup (dev only).
# Deletes uploaded files (product images, avatars) stored in DB.
# Static assets (logo, slides, css, js) are NEVER affected.
# Usage: add -Dapp.seed.reset=true to JVM args, or set in application-dev.properties
app.seed.reset=false

# ── Logging ─────────────────────────────────────────────────
logging.level.com.chickenexpress=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# Write logs to file so errors are easy to find
logging.file.name=logs/chickenexpress.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=3

# ── Groq AI (chatbot) ────────────────────────────────────────
groq.api-key=${GROQ_API_KEY:}
groq.api-url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-8b-instant
